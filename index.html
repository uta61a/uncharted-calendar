<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>入試カウント</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="setup" class="setup">
      <form id="date-form" class="date-form">
        <label for="exam-date">入試日</label>
        <div class="date-input">
          <input id="exam-date" type="date" required />
          <button id="calendar-button" class="calendar-button" type="button" aria-label="カレンダー"></button>
        </div>
        <button type="submit">設定</button>
      </form>
    </main>

    <main id="home" class="home hidden">
      <div class="glow"></div>
      <section class="countdown">
        <p class="title">受験まで</p>
        <output id="days" class="days">0</output>
        <p class="day-label">日</p>
        <div class="time-row">
          <time class="time-box">
            <span id="hours">0</span>
            <span>時間</span>
          </time>
          <time class="time-box">
            <span id="minutes">0</span>
            <span>分</span>
          </time>
          <time class="time-box live">
            <span id="seconds">0</span>
            <span>秒</span>
          </time>
        </div>
      </section>
      <button id="change" class="change">変更</button>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
